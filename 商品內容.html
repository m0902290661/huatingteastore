<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>華庭茶葉商城</title>
    <link rel="icon" type="png" href="logo.png">
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <header>
        <h1><img src="logo.png" alt="華庭茶葉 Logo"> 華庭茶葉 商城</h1>
    </header>
    
    <main>
        <!-- 首頁商品列表區塊 -->
        <div id="homeSection">
            <div class="推薦">
                <h2>推薦商品</h2>
                <div class="card">
                    <img src="華庭茶葉節日禮盒.png" alt="華庭茶葉節日禮盒">
                    <p>華庭茶葉節日禮盒</p>
                    <p>NTD 1000起</p>
                    <a href="?id=華庭茶葉節日禮盒" class="product-link">查看</a>
                </div>
            </div>
            
            <div class="新品上市">
                <h2>新品上市</h2>
                <div class="card">
                    <img src="華庭茶葉節日禮盒.png" alt="華庭茶葉節日禮盒">
                    <p>華庭茶葉節日禮盒</p>
                    <p>NTD 1000起</p>
                    <a href="?id=高山烏龍茶" class="product-link">查看</a>
                </div>
            </div>
        </div>

        <!-- 商品詳細內容與選擇區塊 -->
        <div id="detailSection" style="display: none;">
            <h2 id="productTitle">商品標題載入中...</h2>
            <img id="productImg" src="" alt="商品圖片">
            
            <!-- GAS 擷取的商品介紹內容 -->
            <p id="productDesc">向 GAS 擷取商品介紹中...</p>
            
            <!-- 動態選擇搭配區塊 -->
            <div id="selectionSection" style="margin-top: 20px; padding: 15px; border: 1px solid #ccc;">
                <h3>規格與搭配選擇</h3>
                
                <p id="teaPriceText">茶葉價錢載入中...</p>
                
                <!-- 選擇罐子 -->
                <div style="margin: 10px 0;">
                    <label for="canSelect">選擇搭配罐子：</label>
                    <select id="canSelect">
                        <option value="">請選擇罐子</option>
                    </select>
                </div>

                <!-- 選擇禮盒 -->
                <div style="margin: 10px 0;">
                    <label for="boxSelect">選擇搭配禮盒：</label>
                    <select id="boxSelect">
                        <option value="">請選擇禮盒</option>
                    </select>
                </div>
                
                <!-- 總價顯示 -->
                <h4>總金額：<span id="totalPrice">0</span> 元</h4>
            </div>
            
            <p style="margin-top: 20px;">
                <a href="#" id="backHomeBtn">返回首頁</a>
            </p>
        </div>
    </main>

    <footer>
        <p>華庭茶葉 huatingtea.com</p>
        <p>客服專線：0937-780661</p>
        <p>本頁由 許元洧 維護</p>
    </footer>

    <script>
        const homeSection = document.getElementById('homeSection');
        const detailSection = document.getElementById('detailSection');
        const titleElement = document.getElementById('productTitle');
        const imgElement = document.getElementById('productImg');
        const descElement = document.getElementById('productDesc');
        const teaPriceText = document.getElementById('teaPriceText');
        const canSelect = document.getElementById('canSelect');
        const boxSelect = document.getElementById('boxSelect');
        const totalPriceEl = document.getElementById('totalPrice');
        const backHomeBtn = document.getElementById('backHomeBtn');

        let baseTeaPrice = 0;

        function checkUrlAndRender() {
            const urlParams = new URLSearchParams(window.location.search);
            const productId = urlParams.get('id');

            if (productId) {
                homeSection.style.display = 'none';
                detailSection.style.display = 'block';

                titleElement.innerText = productId;
                imgElement.src = `${productId}.png`;
                imgElement.alt = productId;
                descElement.innerText = `正在向 GAS 擷取 [ ${productId} ] 的資料...`;

                // ==========================================
                // 實際串接您的 GAS 網址 (請替換為您的 GAS 部署網址)
                // ==========================================
                const GAS_URL = "您的GAS網址"; 
                
                fetch(`${GAS_URL}?id=${encodeURIComponent(productId)}`)
                    .then(res => res.json())
                    .then(data => {
                        // 填入介紹
                        descElement.innerText = data.description;
                        
                        // 填入茶葉價錢
                        baseTeaPrice = Number(data.teaPrice) || 0;
                        teaPriceText.innerText = `茶葉基本定價：${baseTeaPrice} 元`;
                        
                        // 動態載入罐子選項
                        canSelect.innerHTML = '<option value="0">不需搭配罐子 (0元)</option>';
                        data.cans.forEach(can => {
                            let opt = document.createElement('option');
                            opt.value = can.price;
                            opt.text = `${can.name} (+${can.price}元)`;
                            canSelect.appendChild(opt);
                        });

                        // 動態載入禮盒選項
                        boxSelect.innerHTML = '<option value="0">不需搭配禮盒 (0元)</option>';
                        data.boxes.forEach(box => {
                            let opt = document.createElement('option');
                            opt.value = box.price;
                            opt.text = `${box.name} (+${box.price}元)`;
                            boxSelect.appendChild(opt);
                        });

                        calculateTotal();
                    })
                    .catch(err => {
                        descElement.innerText = '載入商品資料失敗，請檢查網路或 GAS 連結。';
                        console.error(err);
                    });

            } else {
                homeSection.style.display = 'block';
                detailSection.style.display = 'none';
            }
        }

        // 計算總價邏輯
        function calculateTotal() {
            let canPrice = Number(canSelect.value) || 0;
            let boxPrice = Number(boxSelect.value) || 0;
            let total = baseTeaPrice + canPrice + boxPrice;
            totalPriceEl.innerText = total;
        }

        // 聆聽下拉選單變動以即時更新總價
        canSelect.addEventListener('change', calculateTotal);
        boxSelect.addEventListener('change', calculateTotal);

        checkUrlAndRender();

        backHomeBtn.addEventListener('click', function(e) {
            e.preventDefault();
            window.history.pushState({}, '', window.location.pathname);
            detailSection.style.display = 'none';
            homeSection.style.display = 'block';
        });
    </script>
</body>
</html>
